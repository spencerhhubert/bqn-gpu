name: Observatory

on:
  push:
    branches: [main]
    tags: ["site-v*"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check

  deploy:
    if: startsWith(github.ref, 'refs/tags/site-v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: observatory
      url: https://bqn-gpu-observatory.spencerhhubert.workers.dev
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations
        run: npm run migrate:remote
      - name: Deploy Worker and assets
        env:
          BENCHMARK_INGEST_TOKEN: ${{ secrets.BENCHMARK_INGEST_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/bqn-gpu-worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg token "$BENCHMARK_INGEST_TOKEN" \
            '{BENCHMARK_INGEST_TOKEN: $token}' > "$secrets_file"
          chmod 600 "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"
